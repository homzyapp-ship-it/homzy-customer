name: hyper_local
description: "Homzy - shop from nearby stores (customer app)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  go_router: ^17.3.0
  flutter_bloc: ^9.1.1
  flutter_animate: 4.5.2
  equatable: ^2.0.7
  dio: ^5.8.0+1
  fluttertoast: ^9.1.0
  intl_phone_field: ^3.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  collection: ^1.18.0
  path: ^1.9.0
  flutter_styled_toast: ^2.2.1
  animated_hint_textfield: ^1.0.3
  heroicons_flutter: ^0.5.0
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  geocoding: ^4.0.0
  flutter_tabler_icons: ^1.43.0
  google_places_flutter: ^2.0.6
  change_app_package_name: ^1.5.0
  shimmer: ^3.0.0
  hive_generator: ^2.0.1
  carousel_slider: ^5.1.2
  intl: ^0.20.2
  timezone: ^0.11.0
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  remixicon: ^4.9.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_html: 3.0.0
  animations: ^2.0.11
  circular_gradient_spinner: ^0.0.3
  confetti: ^0.8.0
  image_picker: ^1.2.0
  razorpay_flutter: ^1.3.7
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  file_saver: ^0.4.0
  url_launcher: ^6.3.2
  flutter_stripe: ^13.0.0
  pay_with_paystack: ^1.0.14
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_auth: ^6.1.4
  flutter_local_notifications: ^22.0.1
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.0.0
  speech_to_text: ^7.3.0
  shared_preferences: ^2.5.3
  lottie: ^3.3.2
  photo_view: ^0.15.0
  youtube_player_flutter: ^10.0.1
  video_player: ^2.10.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.6.0
  sign_in_with_apple: ^8.1.0
  fast_cached_network_image: ^1.3.3+5
  webview_flutter: ^4.13.0
  file_picker: 12.0.0
  freezed_annotation: ^3.1.0
  flutter_phoenix: ^1.1.1
  sms_autofill: ^2.3.0
  pin_code_fields: ^9.4.0
  app_links: ^7.0.0
  share_plus: ^13.1.0
  easy_stepper: ^1.0.1
  package_info_plus: ^10.1.0
  get_it: ^9.2.1
  spring_bottom_sheet: ^0.0.3
  build_runner: ^2.4.13
  animated_theme_switcher: ^2.0.10
  visibility_detector: ^0.4.0+2
  flutter_http_inspector:
    git:
      url: https://github.com/InfinitieParasgiri/flutter_http_inspector.git
  flutter_svg: ^2.3.0
  syncfusion_flutter_datepicker: ^34.1.31
  flutter_staggered_animations_plus: ^1.0.2
  hugeicons: ^1.1.7

dependency_overrides:
  # flutter_html 3.0.0 imports html's internal src/query_selector.dart and calls
  # the top-level matches() function, which was removed in html 0.15.7.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_launcher_logo/launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_launcher_logo/launcher_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/payment-logos/
    - assets/images/wallet/
    - assets/images/app_logos/
    - assets/images/empty-states/
    - assets/animations/
    - assets/sounds/
    - assets/
    - assets/fonts/
    - assets/fonts/Figtree/
    - assets/fonts/Figtree/static/
    - assets/images/app_launcher_logo/
    - assets/svg/

  fonts:
    - family: Figtree
      fonts:
          - asset: assets/fonts/Figtree/static/Figtree-Light.ttf
            weight: 300
          - asset: assets/fonts/Figtree/static/Figtree-Regular.ttf
            weight: 400
          - asset: assets/fonts/Figtree/static/Figtree-Medium.ttf
            weight: 500
          - asset: assets/fonts/Figtree/static/Figtree-SemiBold.ttf
            weight: 600
          - asset: assets/fonts/Figtree/static/Figtree-Bold.ttf
            weight: 700
          - asset: assets/fonts/Figtree/static/Figtree-ExtraBold.ttf
            weight: 800
          - asset: assets/fonts/Figtree/static/Figtree-Black.ttf
            weight: 900
